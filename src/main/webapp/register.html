<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account | City Recreational Spaces Navigator</title>
    <link rel="stylesheet" href="css/app.css">
    <script src="js/auth.js"></script>
</head>
<body>

<header class="site-header">
    <div class="inner">
        <a class="brand" href="index.html">
            <span class="mark">&#127795;</span>
            <span>City Recreational Spaces<small>Find it. Check it. Reserve it.</small></span>
        </a>
        <nav class="nav-links">
            <a href="explore.html">Explore</a>
            <a href="events.html">Events</a>
        </nav>
        <div class="nav-spacer"></div>
        <div class="nav-auth">
            <a class="btn btn-ghost" href="login.html">Sign in</a>
        </div>
    </div>
</header>

<main class="page" style="max-width:520px;">
    <div class="page-head" style="text-align:center;">
        <h1>Create your account</h1>
        <p>Join to favorite spaces, join events, and participate in discussions.</p>
    </div>

    <section class="card card-pad">
        <div id="error-box" class="err-state" style="display:none;margin-bottom:1rem;padding:.6rem .8rem;background:#fee2e2;border:1px solid #f87171;border-radius:var(--radius);font-size:.85rem;color:#b91c1c;"></div>

        <form id="reg-form">
            <div class="field">
                <label for="email">Email address</label>
                <input type="email" id="email" placeholder="you@example.com" required autocomplete="off">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Choose a password" required autocomplete="off">
            </div>
            <div class="field">
                <label for="confirm">Confirm password</label>
                <input type="password" id="confirm" placeholder="Re-enter your password" required autocomplete="off">
            </div>
            <div class="field">
                <label for="phone">Phone number (for 2FA verification)</label>
                <input type="tel" id="phone" placeholder="555-123-4567" autocomplete="off">
            </div>
            <div class="field">
                <label for="role">Account type</label>
                <select id="role">
                    <option value="GENERAL_USER">General user — browse, favorite, join events, comment</option>
                    <option value="RESERVATION_USER">Reservation user — also reserve spaces (needs 2FA + billing)</option>
                </select>
            </div>
            <button type="submit" id="submit-btn" class="btn btn-primary btn-block">Create account</button>
        </form>

        <p style="margin-top:1.2rem;font-size:.88rem;text-align:center;">
            Already have an account? <a href="login.html">Sign in</a>
        </p>
    </section>
</main>

<footer class="site-footer">
    <div class="inner">
        <p style="color:var(--text-faint);">&copy; 2026 City Recreational Spaces Navigator &middot; Team 3, CS157A</p>
    </div>
</footer>

<script>
    document.getElementById('reg-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errBox = document.getElementById('error-box');
        const btn = document.getElementById('submit-btn');
        errBox.style.display = 'none';

        const email = document.getElementById('email').value.trim();
        const pass = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;
        const phone = document.getElementById('phone').value.trim();
        const role = document.getElementById('role').value;

        if (pass !== confirm) {
            errBox.textContent = 'Passwords do not match.';
            errBox.style.display = 'block';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Creating account...';

        try {
            const res = await Auth.register(email, pass, phone, role);
            if (res.success) {
                window.location.href = 'profile.html';
            } else {
                errBox.textContent = res.error || 'Registration failed.';
                errBox.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Create account';
            }
        } catch (err) {
            errBox.textContent = 'Server connection error.';
            errBox.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Create account';
        }
    });
</script>

</body>
</html>
