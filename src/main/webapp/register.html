<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account | City Recreational Spaces Navigator</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="site-header">
    <div class="inner">
        <a class="brand" href="index.html">
            <span class="mark">&#127795;</span>
            <span>
                City Recreational Spaces
                <small>Find it. Check it. Reserve it.</small>
            </span>
        </a>

        <nav class="nav-links">
            <a href="explore.html">Explore</a>
            <a href="events.html">Events</a>
            <a href="discussions.html">Discussions</a>
        </nav>

        <div class="nav-spacer"></div>

        <div class="nav-auth">
            <a class="btn btn-ghost" href="login.html">
                Sign in
            </a>
        </div>
    </div>
</header>

<main class="page" style="max-width:520px;">

    <div class="page-head" style="text-align:center;">
        <h1>Create your account</h1>
        <p>Join the recreational spaces community.</p>
    </div>

    <section class="card card-pad">

        <p class="form-note">
            Create an account to join events and participate in discussions.
        </p>

        <form id="register-form">

            <div class="field">
                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Choose a password"
                    autocomplete="new-password"
                    minlength="8"
                    required>
            </div>

            <div class="field">
                <label for="confirm">Confirm password</label>
                <input
                    type="password"
                    id="confirm"
                    name="confirmPassword"
                    placeholder="Re-enter your password"
                    autocomplete="new-password"
                    minlength="8"
                    required>
            </div>

            <div class="field">
                <label for="role">Account type</label>
                <select id="role" name="role">
                    <option value="GENERAL_USER">
                        General user
                    </option>
                    <option value="RESERVATION_USER">
                        Reservation user
                    </option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                Create account
            </button>
        </form>

        <p id="msg" class="form-message" role="status" aria-live="polite"></p>

        <p style="margin-top:1rem;font-size:.88rem;text-align:center;">
            Already have an account?
            <a href="login.html">Sign in</a>
        </p>

    </section>
</main>

<footer class="site-footer">
    <div class="inner">
        <p style="color:var(--text-faint);">
            &copy; 2026 City Recreational Spaces Navigator
        </p>
    </div>
</footer>

<script src="js/auth.js"></script>
</body>
</html>
